name: export

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify project version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION=$(grep -oP '(?<=config/version=")[^"]+' project.godot)

          if [ "$PROJECT_VERSION" != "$TAG" ]; then
            echo "::error file=project.godot::expected version $TAG (from tag) but found $PROJECT_VERSION"
            exit 1
          fi

      - name: Verify xmllint
        shell: bash
        run: |
          command -v xmllint >/dev/null 2>&1 || {
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-utils
          }

      - name: Verify project
        id: godot
        shell: bash
        env:
          CSPROJ_PATH: "Rhythia.csproj"
          VERSION_FILE: ".github/godot_version.txt"
        run: |
          if compgen -G "${CSPROJ_PATH}.old*" > /dev/null; then
            echo "::error file=${CSPROJ_PATH}.old::${CSPROJ_PATH}.old migration exists"
            exit 1
          fi

          if [ ! -f "$CSPROJ_PATH" ]; then
            echo "::error::$CSPROJ_PATH not found"
            exit 1
          fi

          if [ ! -f "$VERSION_FILE" ]; then
            echo "::error::$VERSION_FILE not found"
            exit 1
          fi

          EXPECTED_VERSION=$(tr -d '[:space:]' < "$VERSION_FILE")
          EXPECTED_SDK="Godot.NET.Sdk/${EXPECTED_VERSION}"

          ACTUAL_SDK=$(xmllint --xpath 'string(/Project/@Sdk)' "$CSPROJ_PATH")

          if [ -z "$ACTUAL_SDK" ]; then
            echo "::error file=$CSPROJ_PATH::no <Project Sdk=\"...\"> attribute found"
            exit 1
          fi

          if [ "$ACTUAL_SDK" != "$EXPECTED_SDK" ]; then
            echo "::error file=$CSPROJ_PATH::expected Sdk=\"$EXPECTED_SDK\" but found Sdk=\"$ACTUAL_SDK\""
            exit 1
          fi

          echo "Godot SDK OK: $ACTUAL_SDK"

          echo "version=$EXPECTED_VERSION" >> "$GITHUB_OUTPUT"
          echo "base_url=https://github.com/godotengine/godot-builds/releases/download/${EXPECTED_VERSION}-stable" >> "$GITHUB_OUTPUT"

      - name: Setup
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # Dotnet 4.0.2
        with:
          dotnet-version: 10.0.x
          cache: true

      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Build project
        run: dotnet build Rhythia.csproj --no-restore

      - name: Detect build type
        id: kind
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Export builds
        id: export
        uses: firebelley/godot-export@615a6f7afc22d6266bf55c17748fb07447e8bdab # v8.0.0
        with:
          godot_executable_download_url: ${{ steps.godot.outputs.base_url }}/Godot_v${{ steps.godot.outputs.version }}-stable_mono_linux_x86_64.zip
          godot_export_templates_download_url: ${{ steps.godot.outputs.base_url }}/Godot_v${{ steps.godot.outputs.version }}-stable_mono_export_templates.tpz
          export_debug: ${{ steps.kind.outputs.prerelease }}
          relative_project_path: ./
          relative_export_path: builds
          cache: true

      - name: Verify exports exist
        shell: bash
        run: |
          test -f "builds/Windows Desktop/Rhythia.exe" || { echo "::error::Windows export missing"; exit 1; }
          test -f "builds/Linux/Rhythia.x86_64" || { echo "::error::Linux export missing"; exit 1; }
          test -f "builds/macOS/Rhythia.zip" || { echo "::error::macOS export missing"; exit 1; }

      - name: Compress exports
        run: |
          mkdir -p dist
          (cd "builds/Windows Desktop" && zip -r "$GITHUB_WORKSPACE/dist/windows.zip" .)
          (cd "builds/Linux" && zip -r "$GITHUB_WORKSPACE/dist/linux.zip" .)
          cp builds/macOS/Rhythia.zip dist/macos.zip

      - name: Upload Windows build for installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rhythia-windows
          path: builds/Windows Desktop/
          if-no-files-found: error

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ steps.kind.outputs.prerelease }}
        run: |
          FLAGS=""
          [[ "$PRERELEASE" == "true" ]] && FLAGS="--prerelease"
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" $FLAGS

      - name: Upload to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
  installer:
    needs: export
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rhythia-windows
          path: builds/Windows Desktop/

      - name: Build installer
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$version" `
            "/DSourceDir=$env:GITHUB_WORKSPACE\builds\Windows Desktop" `
            "/DOutputDir=$env:GITHUB_WORKSPACE\dist" `
            installer\rhythia.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload $env:GITHUB_REF_NAME dist\*.exe --clobber

